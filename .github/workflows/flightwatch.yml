name: flightwatch

on:
  schedule:
    - cron: "23 0 * * *"      # 每天 17:23 美西夏令时（= 次日 00:23 UTC）
                              # 刻意避开整点 —— GitHub 官方说整点是调度最拥堵的时刻，会延迟甚至丢弃
                              # GitHub cron 只认 UTC、不跟夏令时，冬天会变成 16:00 PT
  workflow_dispatch:
    inputs:
      force_email:
        description: "即使没有触发也发一封摘要"
        type: boolean
        default: false

concurrency:
  group: flightwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 需要把 flights.db 和看板写回仓库
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          TP_TOKEN:     ${{ secrets.TP_TOKEN }}
          SERPAPI_KEY:  ${{ secrets.SERPAPI_KEY }}
          SMTP_USER:    ${{ secrets.SMTP_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS }}
          ALERT_TO:     ${{ secrets.ALERT_TO }}
        run: |
          python watch.py --digest-days 1 ${{ inputs.force_email && '--force-email' || '' }}

      - name: Persist history
        run: |
          git config user.name  "flightwatch"
          git config user.email "actions@github.com"
          git add flights.db dashboard.html
          git diff --cached --quiet || git commit -m "watch $(date -u +%F)"
          git push

      # 看板永远可下载：Actions 页面 → 本次运行 → Artifacts
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard.html
          retention-days: 30

      # 想要一个固定网址的话：仓库 Settings → Pages 打开，
      # 再到 Settings → Variables → Actions 加一个 ENABLE_PAGES = true
      - name: Prepare Pages
        if: vars.ENABLE_PAGES == 'true'
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
      - name: Upload Pages artifact
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: watch
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
